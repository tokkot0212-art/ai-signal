# 噂・リーク系の表現（一次情報リンクが無いと「未確認」扱い）
rumor_phrases:
  - リーク
  - 噂
  - らしい
  - 未確認
  - 関係者によると
  - leak
  - leaked
  - rumor
  - rumour
  - reportedly
  - sources say
  - allegedly
  - unconfirmed

# ---- 日本語の概要・解説と最終判定（Claude）----
# ANTHROPIC_API_KEY を GitHub Secrets に入れたときだけ動きます
# 各話題に「概要」「理解を深めるポイント」「用語解説」を日本語で付けます（英語投稿も日本語化）
# 一度作った概要はキャッシュするので、同じ話題に二重課金はしません
llm:
  enabled: true
  model: claude-haiku-5-5
  max_clusters: 80   # 概要を付ける話題の最大数（ノイズは対象外。作成済みは再利用するので課金は新しい話題の分だけ）
  batch_size: 6      # 1回のAPI呼び出しでまとめて処理する話題数
