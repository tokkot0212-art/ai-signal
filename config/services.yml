# =========================================================
#  注目するAIサービス一覧（アルゴリズムが参照するカタログ）
#  元にした情報: 2026年9月に整理した「カリフォルニア発の大手AIエージェント」と
#                「大手に買収されてもおかしくないニッチ領域のAIエージェント20社＋Vesence」
#
#  使われ方（すべて追加費用なし）
#   1. 投稿にサービス名が出たら、話題に「サービス名・分野」のタグを付ける
#   2. 注目サービスの話題は並び順を少し上げる（ニッチ企業はさらに少し上げ、大手の話題に埋もれないようにする）
#   3. 資金調達・買収・提携・新機能などの「動き」を自動で見分けてタグにする
#   4. 公式サイト（domains）へのリンクは「一次情報」として扱う
#   5. プロフィールのリンク先が公式サイトで、名前に会社名が入っている大きめのアカウントは「公式」と判定する
#   6. キーワード探索の一部を、ここにある名前の「発表・調達・買収」の検索に回す（取得件数・費用は変わらない）
#
#  追加のしかた: 下の services に1件足すだけ。
#   aliases … 投稿の中で探す名前。大文字小文字を区別します（"Cursor" と一般語の "cursor" を区別するため）
#   query   … X 検索に使う語（空なら探索の検索には使わない）
#   domains … 確認できた公式サイトだけを書く（他人のサイトを書くと誤って信頼してしまうため）
# =========================================================

categories:
  work: 業務・汎用
  coding: コーディング
  browser: ブラウザ・PC操作
  platform: エージェント基盤
  legal: 法務
  medical: 医療
  voice: 音声・顧客対応
  finance: 金融・経理
  security: セキュリティ
  logistics: 物流
  manufacturing: 製造
  restaurant: 飲食

# サービス名と一緒に出たら「動き」とみなす表現（大文字小文字は区別しない）
events:
  funding:
    label: 資金調達
    words: [raises, raised, "Series A", "Series B", "Series C", "Series D", "Series E", seed round, funding round,
            valuation, 資金調達, 調達, 評価額, シリーズA, シリーズB, シリーズC, シリーズD]
  acquisition:
    label: 買収
    words: [acquires, acquired, acquisition, to acquire, 買収, 傘下]
  partnership:
    label: 提携
    words: [partnership, partners with, partnering, 提携, 協業, 連携を発表]
  launch:
    label: 新機能・公開
    words: [launch, launches, launched, introducing, now available, released, rolling out, general availability,
            リリース, 提供開始, 公開, 発表, 新機能, 一般提供]

# 探索の検索で、サービス名と組み合わせる語（X検索。大文字小文字は区別されない）
event_query: (launch OR launches OR introducing OR raises OR acquires OR acquisition OR "Series" OR リリース OR 提供開始 OR 資金調達 OR 買収 OR 提携)

