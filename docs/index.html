<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AIシグナル</title>
<meta name="description" content="Xから本物のAIニュースだけを選別する自分用リーダー">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AIシグナル">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --ink:#16181d; --sub:#5d626c; --line:#e4e0d6;
  --chip:#efece4; --accent:#1b4dd6;
  --ok:#11845b; --ok-bg:#e3f4ec; --blue:#1b4dd6; --blue-bg:#e6ecfc;
  --warn:#a6600b; --warn-bg:#fbf0dc; --mute:#80858f; --mute-bg:#ecebe7;
  --bar:#e9e6de;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --ink:#eceef2; --sub:#9aa0ab; --line:#262a33;
    --chip:#20242c; --accent:#7ea2ff;
    --ok:#4fd19b; --ok-bg:#12291f; --blue:#7ea2ff; --blue-bg:#18213a;
    --warn:#f0b452; --warn-bg:#2d2312; --mute:#8b919c; --mute-bg:#1f2228;
    --bar:#262a33;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --ink:#eceef2; --sub:#9aa0ab; --line:#262a33;
  --chip:#20242c; --accent:#7ea2ff;
  --ok:#4fd19b; --ok-bg:#12291f; --blue:#7ea2ff; --blue-bg:#18213a;
  --warn:#f0b452; --warn-bg:#2d2312; --mute:#8b919c; --mute-bg:#1f2228;
  --bar:#262a33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
}
header{
  position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);
}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.logo{width:30px;height:30px;border-radius:9px;flex:none}
h1{font-size:20px;letter-spacing:.02em;margin:0;font-weight:800}
.updated{font-size:12px;color:var(--sub);margin-left:auto;text-align:right;line-height:1.3}
.iconbtn{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;flex:none;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;margin:12px auto 0;max-width:720px;background:var(--chip);padding:4px;border-radius:12px}
.tab{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;font-weight:700;
  padding:7px 4px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab .n{font-weight:600;color:var(--sub);margin-left:4px;font-size:12px}
.filters{display:flex;gap:6px;max-width:720px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters[hidden]{display:none}
.hist-bar{display:flex;flex-wrap:wrap;gap:6px;max-width:720px;margin:10px auto 0;align-items:center}
.hist-bar[hidden]{display:none}
.hist-bar select,.hist-bar input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.hist-bar input{flex:1 1 100%;order:-1}
.hist-bar select{flex:1}
.hday{font-size:13px;font-weight:800;color:var(--sub);margin:18px 2px 8px;letter-spacing:.04em}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0}
.hitem summary{list-style:none;cursor:pointer;padding:12px 14px;display:block;color:var(--ink);font-weight:400}
.hitem summary::-webkit-details-marker{display:none}
.hitem summary::after,.hitem[open] summary::after{content:none}
.hitem .ht{font-size:15.5px;font-weight:750;line-height:1.45;margin-top:4px}
.hitem .hs{font-size:13.5px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hitem[open] .hs{display:none}
.hitem .hb{padding:0 14px 12px}
.hitem mark{background:var(--warn-bg);color:inherit;border-radius:3px}
.chip{border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:13px;
  padding:4px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px 16px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.intro{font-size:13px;color:var(--sub);margin:0 2px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  transition:opacity .2s}
.card.read{opacity:.55}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.03em}
.b-confirmed{color:var(--ok);background:var(--ok-bg)}
.b-promising{color:var(--blue);background:var(--blue-bg)}
.b-unverified{color:var(--warn);background:var(--warn-bg)}
.b-excluded{color:var(--mute);background:var(--mute-bg)}
.time{font-size:12px;color:var(--sub)}
.ev{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.ev.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.ev.ng{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.au small{font-weight:500;color:var(--sub);margin-left:4px}
.au.t-official{color:var(--ok);font-weight:700}
.au.t-researcher,.au.t-journalist{color:var(--blue);font-weight:700}
.au.t-promoter{color:var(--warn)}
.count{font-size:12px;color:var(--sub);margin-left:auto}
.title{font-size:17px;font-weight:750;line-height:1.45;margin:10px 0 6px;word-break:break-word}
.summary{font-size:14.5px;color:var(--ink);margin:0 0 8px}
.ov{background:var(--chip);border-radius:12px;padding:12px 14px;margin:8px 0 4px}
.ov-h{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.06em;margin:0 0 4px}
.ov-h:not(:first-child){margin-top:10px}
.ov p{margin:0;font-size:14.5px;line-height:1.7}
.ov ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.65}
.ov li{margin:2px 0}
.ov li::marker{color:var(--accent)}
.terms{display:flex;flex-direction:column;gap:6px}
.term{font-size:13.5px;line-height:1.55}
.term b{display:inline-block;color:var(--accent);background:var(--surface);border-radius:6px;padding:0 7px;margin-right:6px;font-size:12.5px}
.ov.raw p{color:var(--sub);font-size:13.5px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.meter label{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
.meter label b{color:var(--ink);font-weight:700}
.track{height:6px;background:var(--bar);border-radius:6px;overflow:hidden;margin-top:3px}
.fill{height:100%;border-radius:6px}
.authors{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.au{font-size:12.5px;background:var(--chip);border-radius:8px;padding:2px 8px;color:var(--sub)}
.au.t1{color:var(--ok);font-weight:700}
.au.t2{color:var(--blue);font-weight:700}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:700;list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}
.reasons{list-style:none;margin:6px 0 10px;padding:0;font-size:13.5px}
.reasons li{padding:2px 0 2px 22px;position:relative}
.reasons li::before{position:absolute;left:2px;font-weight:800}
.reasons .p::before{content:"✓";color:var(--ok)}
.reasons .m::before{content:"✕";color:var(--warn)}
.reasons .ai::before{content:"AI";font-size:10px;top:5px;color:var(--accent)}
.post{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
.post .who{font-size:13px;font-weight:700}
.post .who span{color:var(--sub);font-weight:500}
.post .txt{font-size:14px;white-space:pre-wrap;word-break:break-word;margin:3px 0}
.post .ja{font-size:14px;white-space:pre-wrap;word-break:break-word;margin:4px 0 2px}
.ja-tag{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);background:var(--blue-bg);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.post .txt.orig{font-size:12.5px;color:var(--sub)}
.post .meta{font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.post a,.links a{color:var(--accent);text-decoration:none;font-weight:700}
.links{display:flex;flex-direction:column;gap:4px;margin:8px 0 2px;font-size:13.5px}
.links .prim::before{content:"一次情報 ";font-size:11px;color:var(--ok);font-weight:800}
.open{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:700;color:var(--accent);
  text-decoration:none;background:var(--blue-bg);padding:7px 14px;border-radius:10px}
.empty{text-align:center;color:var(--sub);padding:48px 16px;font-size:14px}
footer{max-width:720px;margin:4px auto 0;padding:0 16px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>AIシグナル</h1>
    <div class="updated" id="updated">読み込み中…</div>
    <button class="iconbtn" id="refresh" aria-label="更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="signal" aria-selected="true">シグナル<span class="n" id="n-signal"></span></button>
    <button class="tab" role="tab" data-tab="unverified" aria-selected="false">意見・噂<span class="n" id="n-unverified"></span></button>
    <button class="tab" role="tab" data-tab="excluded" aria-selected="false">ノイズ<span class="n" id="n-excluded"></span></button>
    <button class="tab" role="tab" data-tab="history" aria-selected="false">履歴</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip" data-h="6" aria-pressed="false">6時間</button>
    <button class="chip" data-h="24" aria-pressed="true">24時間</button>
    <button class="chip" data-h="72" aria-pressed="false">3日</button>
    <button class="chip" data-unread aria-pressed="false">未読のみ</button>
  </div>
  <div class="hist-bar" id="histbar" hidden>
    <select id="hmonth" aria-label="月"></select>
    <input id="hq" type="search" placeholder="キーワードで検索（例: Claude, 論文）" autocomplete="off">
    <button class="chip" id="hconf" aria-pressed="false">確認済みのみ</button>
  </div>
</header>
<main id="main"></main>
<footer id="footer"></footer>

<script>
const LABEL = {confirmed:"確認済み", promising:"有望", unverified:"未確認", excluded:"ノイズ"};
const INTRO = {
  signal:"公式発表・論文やデータ・取材報道・本人が手を動かした検証など、根拠のある話題だけを表示しています。",
  unverified:"噂・リーク・出典不明の話題と、根拠を示さない意見・感想（専門家の発言を含む）。裏付けが出れば「シグナル」へ移ります。",
  excluded:"釣り・回数稼ぎ・宣伝、AIと無関係な投稿、他人の成果を論評・解説しただけの投稿。判定理由を確認できます。",
  history:"これまでに「シグナル」に入った話題の記録です。毎回の自動更新で追加・更新されます。"
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let feed = null;
let state = { tab: store.get("tab","signal"), hours: store.get("hours",24), unread: store.get("unread",false) };
let readSet = new Set(store.get("read", []));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,"")+"万" : n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"千" : String(n||0);

function ago(iso, ref){
  const m = Math.max(0, Math.round(((ref || Date.now()) - new Date(iso)) / 60000));
  if (m < 1) return "たった今";
  if (m < 60) return m + "分前";
  const h = Math.round(m/60);
  return h < 24 ? h + "時間前" : Math.round(h/24) + "日前";
}
function refNow(){ return feed && feed.demo ? new Date(feed.generated_at).getTime() : Date.now(); }
function barColor(v){ return v >= 70 ? "var(--ok)" : v >= 50 ? "var(--blue)" : v >= 35 ? "var(--warn)" : "var(--mute)"; }

function inTab(c){
  if (state.tab === "signal") return c.verdict === "confirmed" || c.verdict === "promising";
  return c.verdict === state.tab;
}
function inTime(c){ return refNow() - new Date(c.latest) <= state.hours * 3600e3; }

function render(){
  if (!feed) return;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === state.tab));
  const isHist = state.tab === "history";
  $("#filters").hidden = isHist; $("#histbar").hidden = !isHist;
  if (isHist){ renderHistory(); return; }
  document.querySelectorAll("#filters .chip").forEach(b => {
    b.setAttribute("aria-pressed", b.hasAttribute("data-unread") ? state.unread : Number(b.dataset.h) === state.hours);
  });
  const timed = feed.clusters.filter(inTime);
  $("#n-signal").textContent = timed.filter(c => c.verdict==="confirmed"||c.verdict==="promising").length;
  $("#n-unverified").textContent = timed.filter(c => c.verdict==="unverified").length;
  $("#n-excluded").textContent = timed.filter(c => c.verdict==="excluded").length;

  let list = timed.filter(inTab);
  if (state.unread) list = list.filter(c => !readSet.has(c.id));

  let html = "";
  if (feed.demo) html += `<div class="banner">サンプルデータを表示しています（架空の投稿）。X APIキーを設定すると本物のフィードに切り替わります。</div>`;
  if (feed.note) html += `<div class="banner">${esc(feed.note)}</div>`;
  if (!feed.demo && !(feed.stats||{}).llm_reviewed && feed.clusters.some(c => c.verdict !== "excluded"))
    html += `<div class="banner">日本語の概要・解説は、GitHub Secrets に ANTHROPIC_API_KEY を登録すると表示されます。</div>`;
  html += `<p class="intro">${INTRO[state.tab]}</p>`;
  html += list.length ? list.map(card).join("") : `<div class="empty">この条件に当てはまる話題はありません</div>`;
  $("#main").innerHTML = html;

  const s = feed.stats || {};
  $("#footer").textContent = `投稿${s.posts ?? 0}件 → 話題${s.clusters ?? 0}件に整理` +
    (s.today_budget_usd != null ? ` ・ 今日のX API $${(s.today_spend_usd||0).toFixed(2)} / $${s.today_budget_usd.toFixed(2)}` : "") +
    (s.month_budget_usd ? ` ・ 今サイクル $${(s.month_spend_usd||0).toFixed(2)} / $${s.month_budget_usd}` : "");
}

function overview(c){
  if (!c.summary){
    const raw = (c.posts[0]?.text || "").replace(/https?:\/\/\S+/g,"").trim();
    if (!raw) return "";
    return `<div class="ov raw"><div class="ov-h">投稿の冒頭（原文）</div><p>${esc(raw.slice(0,140))}${raw.length>140?"…":""}</p></div>`;
  }
  const pts = (c.points||[]).length ? `<div class="ov-h">理解を深めるポイント</div><ul>${c.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>` : "";
  const terms = (c.terms||[]).length ? `<div class="ov-h">用語メモ</div><div class="terms">${c.terms.map(t=>`<div class="term"><b>${esc(t.term)}</b>${esc(t.desc)}</div>`).join("")}</div>` : "";
  return `<div class="ov"><div class="ov-h">概要</div><p>${esc(c.summary)}</p>${pts}${terms}</div>`;
}

// ---------------- 履歴
const hist = { index:null, month:null, data:{}, q:"", conf: store.get("hconf", false) };
async function loadHistoryIndex(){
  if (hist.index) return;
  try{
    const r = await fetch("archive/index.json?t=" + Date.now(), {cache:"no-store"});
    hist.index = r.ok ? await r.json() : {months:{}};
  }catch(e){ hist.index = {months:{}}; }
  const months = Object.keys(hist.index.months||{}).sort().reverse();
  $("#hmonth").innerHTML = months.map(m => `<option value="${m}">${m.replace("-", "年")}月（${hist.index.months[m].count}件）</option>`).join("");
  hist.month = months[0] || null;
}
async function loadMonth(m){
  if (!m || hist.data[m]) return;
  try{
    const r = await fetch(`archive/${m}.json?t=` + Date.now(), {cache:"no-store"});
    hist.data[m] = r.ok ? (await r.json()).items || [] : [];
  }catch(e){ hist.data[m] = []; }
}
function hl(text, q){
  const t = esc(text||"");
  if (!q) return t;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, m => `<mark>${m}</mark>`);
}
function jstDay(iso){
  const d = new Date(new Date(iso).getTime() + 9*3600e3);
  const w = "日月火水木金土"[d.getUTCDay()];
  return `${d.getUTCMonth()+1}月${d.getUTCDate()}日（${w}）`;
}
async function renderHistory(){
  $("#hconf").setAttribute("aria-pressed", hist.conf);
  $("#main").innerHTML = `<p class="intro">${INTRO.history}</p><div class="empty">読み込み中…</div>`;
  await loadHistoryIndex();
  if (!hist.month){ $("#main").innerHTML = `<p class="intro">${INTRO.history}</p><div class="empty">まだ履歴はありません。次回の自動更新から記録されます。</div>`; return; }
  $("#hmonth").value = hist.month;
  await loadMonth(hist.month);
  if (state.tab !== "history") return;
  const q = hist.q.trim().toLowerCase();
  let items = hist.data[hist.month] || [];
  if (hist.conf) items = items.filter(e => e.verdict === "confirmed");
  if (q) items = items.filter(e => [e.title, e.summary, (e.points||[]).join(" "), (e.terms||[]).map(t=>t.term).join(" "),
    e.post && e.post.text, e.post && e.post.text_ja, (e.authors||[]).join(" ")].join(" ").toLowerCase().includes(q));
  let html = `<p class="intro">${INTRO.history}</p>`;
  if (!items.length) html += `<div class="empty">該当する話題はありません</div>`;
  let day = "";
  for (const e of items){
    const d = jstDay(e.first_seen);
    if (d !== day){ html += `<div class="hday">${d}</div>`; day = d; }
    const pts = (e.points||[]).length ? `<div class="ov-h">理解を深めるポイント</div><ul>${e.points.map(p=>`<li>${hl(p,q)}</li>`).join("")}</ul>` : "";
    const terms = (e.terms||[]).length ? `<div class="ov-h">用語メモ</div><div class="terms">${e.terms.map(t=>`<div class="term"><b>${esc(t.term)}</b>${esc(t.desc)}</div>`).join("")}</div>` : "";
    const links = (e.links||[]).length ? `<div class="links">${e.links.map(l=>`<a class="${l.primary?"prim":""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.domain)} ↗</a>`).join("")}</div>` : "";
    const post = e.post ? `<div class="post"><div class="who">@${esc(e.post.username)}</div>
        ${e.post.text_ja ? `<div class="ja"><span class="ja-tag">日本語訳</span>${hl(e.post.text_ja,q)}</div><div class="txt orig">${esc(e.post.text)}</div>` : `<div class="txt">${hl(e.post.text,q)}</div>`}
        <div class="meta"><a href="${esc(e.post.url)}" target="_blank" rel="noopener">Xで開く ↗</a></div></div>` : "";
    html += `<details class="hitem"><summary>
        <div class="row"><span class="badge b-${e.verdict}">${LABEL[e.verdict]}</span>${evChip(e)}<span class="count">${e.post_count}件の投稿</span></div>
        <div class="authors">${(e.author_labels || (e.authors||[]).map(u=>({username:u}))).slice(0,3).map(a=>authorChip({...a, role:a.label})).join("")}</div>
        <div class="ht">${hl(e.title,q)}</div>${e.summary ? `<div class="hs">${hl(e.summary,q)}</div>` : ""}
      </summary><div class="hb">
        ${e.summary ? `<div class="ov"><div class="ov-h">概要</div><p>${hl(e.summary,q)}</p>${pts}${terms}</div>` : ""}
        ${links}${post}
      </div></details>`;
  }
  $("#main").innerHTML = html;
  $("#footer").textContent = `この月の記録 ${(hist.data[hist.month]||[]).length}件`;
}

const EV_OK = {official_announcement:1, paper_or_data:1, reporting:1, hands_on_test:1, expert_analysis:1};
function evChip(e){
  if (!e.evidence_label) return "";
  const cls = EV_OK[e.evidence] ? "ok" : "ng";
  return `<span class="ev ${cls}" title="${esc(e.evidence_note||"")}">根拠：${esc(e.evidence_label)}</span>`;
}
function authorChip(a){
  const label = a.role || a.type_label || "";
  const former = a.former && !label.includes(a.former) ? `・${a.former}` : "";
  return `<span class="au t-${esc(a.type||"")}">@${esc(a.username)}${label ? `<small>${esc(label)}${esc(former)}</small>` : ""}</span>`;
}

function card(c){
  const ref = refNow();
  const authors = c.authors.slice(0,5).map(authorChip).join("");
  const reasons = [
    ...(c.llm_note ? [`<li class="ai">${esc(c.llm_note)}</li>`] : []),
    ...c.reasons_pos.map(r => `<li class="p">${esc(r)}</li>`),
    ...c.reasons_neg.map(r => `<li class="m">${esc(r)}</li>`)
  ].join("");
  const links = c.links.length ? `<div class="links">${c.links.map(l =>
    `<a class="${l.primary?"prim":""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.domain)} ↗</a>`).join("")}</div>` : "";
  const posts = c.posts.map(p => {
    const m = p.metrics || {};
    return `<div class="post">
      <div class="who">${esc(p.name)} <span>@${esc(p.username)}${p.author_role ? " · " + esc(p.author_role) : ""} · ${ago(p.created_at, ref)} · 信頼度${p.cred}</span></div>
      ${p.text_ja
        ? `<div class="ja"><span class="ja-tag">日本語訳</span>${esc(p.text_ja)}</div><div class="txt orig">${esc(p.text)}</div>`
        : `<div class="txt">${esc(p.text)}</div>`}
      <div class="meta"><span>♥ ${num(m.like_count)}</span><span>↻ ${num(m.retweet_count)}</span><span>❝ ${num(m.quote_count)}</span>
        <a href="${esc(p.url)}" target="_blank" rel="noopener" data-read="${c.id}">Xで開く ↗</a></div>
    </div>`;
  }).join("");
  const main = c.posts[0];
  return `<article class="card ${readSet.has(c.id)?"read":""}" id="c-${c.id}">
    <div class="row">
      <span class="badge b-${c.verdict}">${LABEL[c.verdict]}</span>
      ${evChip(c)}
      <span class="time">${ago(c.latest, ref)}</span>
      <span class="count">${c.post_count}件の投稿 · ${c.authors.length}人</span>
    </div>
    <div class="title">${esc(c.title)}</div>
    ${overview(c)}
    <div class="meters">
      <div class="meter"><label>信頼度 <b>${c.credibility}</b></label><div class="track"><div class="fill" style="width:${c.credibility}%;background:${barColor(c.credibility)}"></div></div></div>
      <div class="meter"><label>熱量 <b>${c.heat}</b></label><div class="track"><div class="fill" style="width:${c.heat}%;background:var(--accent)"></div></div></div>
    </div>
    <div class="authors">${authors}</div>
    ${links}
    <details data-read="${c.id}">
      <summary>なぜこの判定？・元の投稿</summary>
      <ul class="reasons">${reasons || '<li class="p">特記事項なし</li>'}</ul>
      ${posts}
    </details>
    <a class="open" href="${esc(main.url)}" target="_blank" rel="noopener" data-read="${c.id}">Xで見る ↗</a>
  </article>`;
}

function markRead(id){
  if (readSet.has(id)) return;
  readSet.add(id);
  store.set("read", [...readSet].slice(-800));
  const el = document.getElementById("c-" + id);
  if (el) el.classList.add("read");
}

async function load(manual){
  const btn = $("#refresh");
  btn.classList.add("spin");
  try{
    const r = await fetch("data/feed.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    feed = await r.json();
    $("#updated").innerHTML = "更新<br>" + ago(feed.generated_at);
    render();
  }catch(e){
    $("#updated").textContent = "オフライン";
    if (!feed) $("#main").innerHTML = `<div class="empty">フィードを読み込めませんでした。通信状況を確認してください。</div>`;
  }finally{
    setTimeout(() => btn.classList.remove("spin"), 300);
  }
}

document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  state.tab = t.dataset.tab; store.set("tab", state.tab); render(); window.scrollTo({top:0});
});
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.hasAttribute("data-unread")){ state.unread = !state.unread; store.set("unread", state.unread); }
  else { state.hours = Number(b.dataset.h); store.set("hours", state.hours); }
  render();
});
$("#main").addEventListener("click", e => {
  const a = e.target.closest("a[data-read]"); if (a) markRead(a.dataset.read);
});
$("#main").addEventListener("toggle", e => {
  if (e.target.matches("details[data-read]") && e.target.open) markRead(e.target.dataset.read);
}, true);
$("#refresh").addEventListener("click", () => { hist.index = null; hist.data = {}; load(true); });
$("#hmonth").addEventListener("change", e => { hist.month = e.target.value; renderHistory(); });
let hqTimer; $("#hq").addEventListener("input", e => { clearTimeout(hqTimer); hqTimer = setTimeout(() => { hist.q = e.target.value; renderHistory(); }, 200); });
$("#hconf").addEventListener("click", () => { hist.conf = !hist.conf; store.set("hconf", hist.conf); renderHistory(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
load();
</script>
</body>
</html>
